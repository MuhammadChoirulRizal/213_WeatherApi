<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation & Weather API - MapTiler</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            padding: 28px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .header h4 {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 13px;
        }

        .search-box button:hover {
            background: #0ea5e9;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            background: #0f172a;
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            font-size: 13px;
        }

        .item .label {
            color: #94a3b8;
        }

        .item .label i {
            color: #38bdf8;
            margin-right: 6px;
            width: 16px;
        }

        .item .value {
            font-weight: 500;
            color: #f1f5f9;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            color: #38bdf8;
            font-size: 13px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2><i class="fa-solid fa-cloud-sun"></i> MapTiler Geolocation</h2>
            <h4>Nama : Muhammad Choirul Rizal</h4>
            <h4>NIM : 20240140213</h4>
        </div>

        <div class="search-box">
            <input type="text" id="inputLokasi" placeholder="Masukkan lokasi (contoh: Yogyakarta)...">
            <button id="btnCari"><i class="fa-solid fa-search"></i> Cari</button>
        </div>

        <div id="loading" class="hidden">
            <i class="fa-solid fa-spinner fa-spin"></i> 
        </div>

        <div id="errorBox" class="error hidden"></div>

        <div id="resultContainer" class="result-box">
            <div class="item">
                <span class="label"><i class="fa-solid fa-location-dot"></i> Lokasi</span>
                <span class="value" id="lokasi">Memuat...</span>
            </div>
            <div class="item">
                <span class="label"><i class="fa-solid fa-flag"></i> Negara</span>
                <span class="value" id="negara">Memuat...</span>
            </div>
            <div class="item">
                <span class="label"><i class="fa-solid fa-map"></i> Provinsi</span>
                <span class="value" id="provinsi">Memuat...</span>
            </div>
            <div class="item">
                <span class="label"><i class="fa-solid fa-city"></i> Kecamatan / Kota</span>
                <span class="value" id="kecamatan">Memuat...</span>
            </div>
            <div class="grid-2">
                <div class="item">
                    <span class="label"><i class="fa-solid fa-compass"></i> Longitude</span>
                    <span class="value" id="longitude">Memuat...</span>
                </div>
                <div class="item">
                    <span class="label"><i class="fa-solid fa-compass"></i> Latitude</span>
                    <span class="value" id="latitude">Memuat...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btnCari = document.getElementById("btnCari");
        const inputLokasi = document.getElementById("inputLokasi");
        const loadingDiv = document.getElementById("loading");
        const errorBox = document.getElementById("errorBox");

        function getLokasiData(query = "") {
            loadingDiv.classList.remove("hidden");
            errorBox.classList.add("hidden");

            const url = query ? `/api/lokasi?q=${encodeURIComponent(query)}` : "/api/lokasi";

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Gagal mengambil data dari server");
                    return response.json();
                })
                .then(data => {
                    console.log("Data API:", data);

                    document.getElementById("lokasi").textContent = data.lokasi || data.kota || "-";
                    document.getElementById("negara").textContent = data.negara || "-";
                    document.getElementById("provinsi").textContent = data.provinsi || "-";
                    document.getElementById("kecamatan").textContent = data.kecamatan || "-";

                    if (typeof data.longitude !== "undefined") {
                        document.getElementById("longitude").textContent = Number(data.longitude).toFixed(4);
                        document.getElementById("latitude").textContent = Number(data.latitude).toFixed(4);
                    } else if (Array.isArray(data.koordinat)) {
                        document.getElementById("longitude").textContent = data.koordinat[0];
                        document.getElementById("latitude").textContent = data.koordinat[1];
                    } else {
                        document.getElementById("longitude").textContent = "-";
                        document.getElementById("latitude").textContent = "-";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    errorBox.textContent = "Gagal mengambil data dari MapTiler API.";
                    errorBox.classList.remove("hidden");
                })
                .finally(() => {
                    loadingDiv.classList.add("hidden");
                });
        }

        // Fetch otomatis saat pertama kali dibuka (Default: Bandung City)
        getLokasiData();

        // Event listener saat tombol cari diklik
        btnCari.addEventListener("click", () => {
            const query = inputLokasi.value.trim();
            if (query) getLokasiData(query);
        });

        // Event listener saat menekan tombol Enter
        inputLokasi.addEventListener("keypress", (e) => {
            if (e.key === "Enter") btnCari.click();
        });
    </script>
    
</body>
</html>
